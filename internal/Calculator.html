<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Circle Calculator</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Calculator Widget Wrapper */
        .calc-box {
            max-width: 360px; /* Reduced width to resemble a handheld calculator grid */
            margin: 0 auto;
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 5px;
            margin-bottom: 8px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px; /* Marginally increased for a better touch-target feel */
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            box-sizing: border-box;
        }
        .result-display {
            margin-top: 15px;
            padding: 15px;
            background: #0f172a;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            color: #38bdf8;
            font-family: monospace;
            font-size: 1.1rem;
            min-height: 40px; /* Snugger height to resemble a digital calculator LCD display screen */
            display: flex;
            align-items: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .submit-btn {
            flex: 1; /* Ensures equal distribution across the calculator width layout */
            margin-top: 0px; /* Stripped vertical margins to keep layout compact */
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 5px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem; /* Slightly balanced text scaling for smaller button dimensions */
        }
    </style>
</head>
<body>

<header class="hero-container">
    <nav>
        <div class="logo">FrontEnd Pro</div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../assignments.html">Assignments</a></li>
        </ul>
    </nav>
    <div class="hero-main">
        <h1>Circle Calculator ⭕</h1>
        <p>Calculate Area and Circumference</p>
    </div>
</header>

<section class="container">
    <div class="card calc-box">
        <label>Enter Radius</label>
        <input type="number" id="radiusInput" placeholder="e.g. 5" step="any">

        <div class="btn-group">
            <button class="submit-btn" onclick="handleCalculation('area')">Calculate Area</button>
            <button class="submit-btn" onclick="handleCalculation('circum')">Circumference</button>
        </div>

        <div class="result-display" id="output">
            Result will appear here...
        </div>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
