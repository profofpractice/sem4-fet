        const securityModule = {
            key: "RE9NX1NFTEVDVE9SX0ZPVU5EXzgx",

                alert("🏆 KEY: " + atob("Q09OVEVYVF9CT1VORF9TVUNDRVNTXzE0"));

            document.getElementById('scope-btn').addEventListener('click', securityModule.generateKey);
