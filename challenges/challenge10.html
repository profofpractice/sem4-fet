    <p>An image payload failed to parse. Inspect the asset element tags to see the fallback data parameters hidden inside.</p>

         data-fallback-token="VE9LRU46IE5FVFdPUktfUkVTT1VSQ0VfUEFUQ0hFRF83Nw==" 
         alt="Broken Asset Indicator" style="border: 2px solid red; padding: 20px; cursor: pointer;">

        document.getElementById('glitch-img').addEventListener('click', () => {
            const token = document.getElementById('glitch-img').getAttribute('data-fallback-token');
            alert("🏆 KEY: " + atob(token).replace("TOKEN: ", ""));
        });
